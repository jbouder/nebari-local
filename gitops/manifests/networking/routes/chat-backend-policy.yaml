# Disable Envoy route timeout for SSE streams. Same rationale as chat-frontend-policy
# https://www.envoyproxy.io/docs/envoy/latest/faq/configuration/timeouts
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: chat-backend-sse-timeout
  namespace: nebari-chat
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: nebari-chat-backend-route
  timeout:
    http:
      requestTimeout: "0s"
      connectionIdleTimeout: 300s