# Disable Envoy route timeout for SSE streams. The default 15s timeout
# is "not compatible with streaming responses and will need to be disabled."
# https://www.envoyproxy.io/docs/envoy/latest/faq/configuration/timeouts
# https://gateway.envoyproxy.io/docs/tasks/traffic/http-timeouts/
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: chat-frontend-sse-timeout
  namespace: nebari-chat
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: nebari-chat-frontend-route
  timeout:
    http:
      requestTimeout: "0s"
      connectionIdleTimeout: 300s