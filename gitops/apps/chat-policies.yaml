# Envoy BackendTrafficPolicies for the chat app's HTTPRoutes (SSE timeout
# overrides). These live in their own app because they target resources in
# the nebari-chat namespace, which the scoped `foundational` AppProject
# rejects — nebari-apps allows wildcard namespaces (nic re-applies the
# AppProjects on every deploy, so widening foundational wouldn't stick).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chat-policies
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-packs
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nebari-apps
  source:
    repoURL: file:///Users/johnnybouder/repos/nebari-local
    targetRevision: main
    path: gitops/manifests/chat-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: nebari-chat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
