apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: provenance-collector
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-packs
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nebari-apps
  source:
    repoURL: https://nebari-dev.github.io/helm-repository
    chart: provenance-collector
    targetRevision: "0.1.3"
    helm:
      releaseName: provenance-collector
      values: |
        schedule: "0 6 * * *"

        # NOTE: this chart's images are amd64-only and image.tag feeds a k8s
        # label, so tag@digest is invalid here. Instead the amd64 images are
        # pre-loaded into the kind node (see README) and pulled IfNotPresent.
        #
        # Both image tags default to the chart appVersion, so bumping
        # targetRevision changes which tags the pods ask for. The retags in
        # scripts/post-recreate.sh MUST move with it or the pods fail with "no
        # match for platform in manifest" on the arm64 node.

        config:
          clusterName: nebari-local
          verifySignatures: true
          helmEnabled: true
          checkUpdates: true

        persistence:
          mode: http
          storageClass: standard
          size: 1Gi

        frontend:
          # NO image override — use the chart default (0.1.3), which sits
          # directly on 5c87fa6, the merged hover fix (PR #81). That is why the
          # branding block below no longer carries the primaryHover/sidebar*
          # overrides.
          #
          # Do NOT point this at the floating `main` tag. This pack publishes no
          # per-commit sha- tags; `main`, `latest` and the release tags are all
          # there is, and `main` has historically lagged a release (the 0.1.2-era
          # `main` image was built from 6d49f84, OLDER than the release, and
          # silently reverted the header work). Use the chart default.
          keycloak:
            # Browser-facing URL used by the SPA's in-browser OIDC login.
            url: https://keycloak.nebari.local
          # Deep Blue & Teal palette, shared with the landing / chat / llm-serving
          # packs and the jhub-apps hub theme. Rendered into /config.json at
          # deploy time — no image rebuild.
          #
          # NOTE on `secondary`: this chart's default is a near-white neutral
          # *surface* token with dark text, not a brand fill, so secondary
          # carries a teal tint and the saturated teal sits on
          # secondaryForeground. Chart default primary is the old Nebari
          # magenta, oklch(55.06% 0.1886 311.45).
          #
          # No primaryHover / sidebarPrimary / sidebarRing overrides: PR #81
          # (in this release) derives those from --primary, so the old Nebari
          # magenta no longer leaks into hover and sidebar states. They were
          # undocumented keys that only worked because the runtime applier
          # kebab-cases whatever the JSON carries with no allowlist — if a
          # future frontend bump ever reintroduces a hardcoded hover shade,
          # that escape hatch still exists.
          branding:
            theme:
              light:
                primary: "#1D4ED8"
                primaryForeground: "#FFFFFF"
                secondary: "#E6FAF7"
                secondaryForeground: "#0F766E"
                accent: "#E8EEFC"
                accentForeground: "#1E3A8A"
                ring: "#1D4ED8"
              dark:
                primary: "#60A5FA"
                primaryForeground: "#0B1220"
                secondary: "#16332F"
                secondaryForeground: "#7FE9DA"
                accent: "#132039"
                accentForeground: "#BFD4FE"
                ring: "#60A5FA"

        webUI:
          enabled: true
          # Split-horizon: the dashboard pod calls userinfo via the in-cluster
          # Keycloak service (the external hostname is not reachable from pods).
          oidcIssuer: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:8080/realms/nebari
          # Gates the "Run Scan" button — EMPTY DISABLES IT (unlike
          # nebariapp.auth.groups, where empty means allow everyone). The
          # realm's group mapper has full.path=false, so the claim carries
          # bare names; both forms listed in case that ever flips.
          adminGroups:
            - argocd-admins
            - /argocd-admins

        nebariapp:
          enabled: true
          hostname: provenance.nebari.local
          service:
            port: 8080
          routing:
            tls:
              enabled: true
          auth:
            enabled: true
            provider: keycloak
            provisionClient: true
            enforceAtGateway: true
            redirectURI: /oauth2/callback
            groups: []
            forwardAccessToken: true
            scopes:
              - openid
              - profile
              - email
              - groups
          landingPage:
            enabled: true
            displayName: "Provenance Collector"
            description: "Container image provenance and compliance reports"
            category: "Platform"
            priority: 10
            healthCheck:
              enabled: true
              path: /healthz
              intervalSeconds: 30
              timeoutSeconds: 5

  destination:
    server: https://kubernetes.default.svc
    namespace: provenance-system

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        nebari.dev/managed: "true"
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
