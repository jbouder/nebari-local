apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: provenance-collector
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-packs
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nebari-apps
  source:
    repoURL: https://nebari-dev.github.io/helm-repository
    chart: provenance-collector
    targetRevision: "0.1.2"
    helm:
      releaseName: provenance-collector
      values: |
        schedule: "0 6 * * *"

        # NOTE: this chart's images are amd64-only and image.tag feeds a k8s
        # label, so tag@digest is invalid here. Instead the amd64 images are
        # pre-loaded into the kind node (see README) and pulled IfNotPresent.

        config:
          clusterName: nebari-local
          verifySignatures: true
          helmEnabled: true
          checkUpdates: true

        persistence:
          mode: http
          storageClass: standard
          size: 1Gi

        frontend:
          # Ahead of the 0.1.2 chart's own frontend build: `main` carries PR #81,
          # which derives --primary-hover / --sidebar-primary / --sidebar-ring
          # from --primary instead of hardcoding the old Nebari magenta. There is
          # no per-commit sha- tag for that merge, so this floats on `main`.
          #
          # Pre-loaded into the kind node by amd64-manifest digest and force-
          # tagged (README "Node-side digest pull + retag"); this chart puts
          # image.tag in a k8s label, so it cannot be digest-pinned here. Re-run
          # that after a cluster recreate or the pod will not find the image:
          #   ghcr.io/nebari-dev/provenance-collector-pack/frontend
          #   sha256:c6719f9753894c950c5bee499fc137fcb297b335c55eec58140516f6372bc215
          #
          # Once a chart release carries the fix, drop this back to the chart
          # default and delete the primaryHover/sidebar* overrides below.
          image:
            tag: "main"
          keycloak:
            # Browser-facing URL used by the SPA's in-browser OIDC login.
            url: https://keycloak.nebari.local
          # Deep Blue & Teal palette, shared with the landing / chat / llm-serving
          # packs and the jhub-apps hub theme. Rendered into /config.json at
          # deploy time — no image rebuild.
          #
          # NOTE on `secondary`: this chart's default is a near-white neutral
          # *surface* token with dark text, not a brand fill, so secondary
          # carries a teal tint and the saturated teal sits on
          # secondaryForeground. Chart default primary is the old Nebari
          # magenta, oklch(55.06% 0.1886 311.45).
          #
          # primaryHover / sidebarPrimary / sidebarRing are NOT in the chart's
          # documented token list, but they are real purple (oklch hue ~311)
          # defaults in the frontend's index.css that `primary` alone does not
          # reach — primaryHover drives every button and badge hover state.
          # They work because the runtime applier kebab-cases whatever keys the
          # JSON carries with no allowlist (ThemeTokens is a compile-time type
          # only), and the chart passes the theme map straight through toJson.
          # Undocumented, so re-check after a frontend bump.
          branding:
            theme:
              light:
                primary: "#1D4ED8"
                primaryForeground: "#FFFFFF"
                secondary: "#E6FAF7"
                secondaryForeground: "#0F766E"
                accent: "#E8EEFC"
                accentForeground: "#1E3A8A"
                ring: "#1D4ED8"
                primaryHover: "#1E3A8A"
                sidebarPrimary: "#1D4ED8"
                sidebarRing: "#1D4ED8"
              dark:
                primary: "#60A5FA"
                primaryForeground: "#0B1220"
                secondary: "#16332F"
                secondaryForeground: "#7FE9DA"
                accent: "#132039"
                accentForeground: "#BFD4FE"
                ring: "#60A5FA"
                primaryHover: "#93C5FD"
                sidebarPrimary: "#60A5FA"
                sidebarRing: "#60A5FA"

        webUI:
          enabled: true
          # Split-horizon: the dashboard pod calls userinfo via the in-cluster
          # Keycloak service (the external hostname is not reachable from pods).
          oidcIssuer: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:8080/realms/nebari
          # Gates the "Run Scan" button — EMPTY DISABLES IT (unlike
          # nebariapp.auth.groups, where empty means allow everyone). The
          # realm's group mapper has full.path=false, so the claim carries
          # bare names; both forms listed in case that ever flips.
          adminGroups:
            - argocd-admins
            - /argocd-admins

        nebariapp:
          enabled: true
          hostname: provenance.nebari.local
          service:
            port: 8080
          routing:
            tls:
              enabled: true
          auth:
            enabled: true
            provider: keycloak
            provisionClient: true
            enforceAtGateway: true
            redirectURI: /oauth2/callback
            groups: []
            forwardAccessToken: true
            scopes:
              - openid
              - profile
              - email
              - groups
          landingPage:
            enabled: true
            displayName: "Provenance Collector"
            description: "Container image provenance and compliance reports"
            category: "Platform"
            priority: 10
            healthCheck:
              enabled: true
              path: /healthz
              intervalSeconds: 30
              timeoutSeconds: 5

  destination:
    server: https://kubernetes.default.svc
    namespace: provenance-system

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        nebari.dev/managed: "true"
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
