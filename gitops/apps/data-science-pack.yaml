apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-science-pack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-packs
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/nebari-dev/nebari-data-science-pack.git
    targetRevision: feat/user-shared-volumes
    path: .
    helm:
      releaseName: data-science-pack
      values: |
        sharedStorage:
          enabled: false
        nebi:
          image:
            repository: quay.io/nebari/nebi
            tag: sha-630e19d
          remoteURL: https://nebi.nebari.local
          internalURL: http://nebi-pack-nebari-nebi-pack.nebi.svc.cluster.local
          namespace: nebi
        nebariapp:
          hostname: hub.nebari.local
          routing:
            routes:
              - pathPrefix: /
          landingPage:
            enabled: true
            displayName: "JupyterHub"
            description: "Interactive Python notebooks for data science"
            icon: "https://jupyter.org/assets/homepage/main-logo.svg"
            category: "Data Science"
        jupyterhub:
          custom:
            external-url: hub.nebari.local
            terminal-customization: false
            nebi-image: quay.io/nebari/nebi:sha-630e19d
            nebi-remote-url: https://nebi.nebari.local
            nebi-internal-url: http://nebi-pack-nebari-nebi-pack.nebi.svc.cluster.local
            # In-cluster token endpoint: the external keycloak.nebari.local
            # hostname is not resolvable/trusted from pods on a local cluster.
            keycloak-token-url: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:8080/realms/nebari/protocol/openid-connect/token
            nebi-client-id: nebi-nebi-pack-nebari-nebi-pack
            jupyterhub-client-id: jupyterhub-data-science-pack-nebari-data-science-pack
            storage-capacity: "10Gi"
            nebi-environment-selector: true
            profiles:
              - display_name: "Small Instance"
                description: "Stable environment with 1 CPU / 2 GB RAM"
                default: true
                kubespawner_override:
                  cpu_limit: 1
                  mem_limit: "2G"
                  cpu_guarantee: 0.5
                  mem_guarantee: "1G"
              - display_name: "Medium Instance"
                description: "Stable environment with 4 CPU / 8 GB RAM"
                kubespawner_override:
                  cpu_limit: 4
                  mem_limit: "8G"
                  cpu_guarantee: 2
                  mem_guarantee: "4G"
            japps-config:
              hub_host: "hub"
              service_workers: 4
              jhub_app_proxy_version: "v0.2.3-rc2"
              additional_services:
                - name: "Nebi"
                  url: "https://nebi.nebari.local"
                  description: "Workspace & environment management"
                  pinned: true
                  thumbnail: "https://raw.githubusercontent.com/nebari-dev/nebi/6b6cef63c67dafd7444f1a3940a0ef8f1dcebb31/assets/nebi-icon.png"
          singleuser:
            image:
              name: quay.io/nebari/nebari-data-science-pack-jupyterlab
              tag: sha-1401182
            networkPolicy:
              egress:
                - to:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: envoy-gateway-system
                      podSelector:
                        matchLabels:
                          gateway.envoyproxy.io/owning-gateway-name: nebari-gateway
                  ports:
                    - port: 10443
                      protocol: TCP
          hub:
            extraEnv:
              JUPYTERHUB_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: data-science-pack-nebari-data-science-pack-oidc-client
                    key: client-secret
            db:
              pvc:
                storageClassName: standard

  destination:
    server: https://kubernetes.default.svc
    namespace: jupyterhub

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        nebari.dev/managed: "true"
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
