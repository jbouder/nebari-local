apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-science-pack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-packs
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nebari-apps

  source:
    repoURL: https://github.com/nebari-dev/nebari-data-science-pack.git
    targetRevision: feat/user-shared-volumes
    path: .
    helm:
      releaseName: data-science-pack
      values: |
        sharedStorage:
          enabled: false
        nebi:
          image:
            repository: quay.io/nebari/nebi
            # amd64-only image pinned by digest for the arm64 kind node (Rosetta)
            tag: "latest@sha256:48de16edc4e12bada5b673c5d511e1f27081e8be3e1fe071e9ba7572eeffc7c8"
          remoteURL: https://nebi.nebari.local
          internalURL: http://nebi-pack-nebari-nebi-pack.nebi.svc.cluster.local
          namespace: nebi
        nebariapp:
          hostname: hub.nebari.local
          routing:
            routes:
              - pathPrefix: /
          auth:
            # Do NOT forward Keycloak's access token upstream: jhub-apps
            # prefers the Authorization header over its own session cookie
            # and can't validate an RS256 Keycloak token (expects its own
            # HS256 JWT) -> every request 401s -> endless login redirect
            # loop. Newer nebari-operator defaults this to true.
            forwardAccessToken: false
          landingPage:
            enabled: true
            displayName: "JupyterHub"
            description: "Interactive Python notebooks for data science"
            icon: "https://jupyter.org/assets/homepage/main-logo.svg"
            category: "Data Science"
        jupyterhub:
          custom:
            external-url: hub.nebari.local
            terminal-customization: false
            nebi-image: quay.io/nebari/nebi:latest@sha256:48de16edc4e12bada5b673c5d511e1f27081e8be3e1fe071e9ba7572eeffc7c8
            nebi-remote-url: https://nebi.nebari.local
            nebi-internal-url: http://nebi-pack-nebari-nebi-pack.nebi.svc.cluster.local
            # In-cluster token endpoint: the external keycloak.nebari.local
            # hostname is not resolvable/trusted from pods on a local cluster.
            keycloak-token-url: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:8080/realms/nebari/protocol/openid-connect/token
            nebi-client-id: nebi-nebi-pack-nebari-nebi-pack
            jupyterhub-client-id: jupyterhub-data-science-pack-nebari-data-science-pack
            storage-capacity: "10Gi"
            nebi-environment-selector: true
            profiles:
              - display_name: "Small Instance"
                description: "Stable environment with 1 CPU / 2 GB RAM"
                default: true
                kubespawner_override:
                  cpu_limit: 1
                  mem_limit: "2G"
                  cpu_guarantee: 0.5
                  mem_guarantee: "1G"
              - display_name: "Medium Instance"
                description: "Stable environment with 4 CPU / 8 GB RAM"
                kubespawner_override:
                  cpu_limit: 4
                  mem_limit: "8G"
                  cpu_guarantee: 2
                  mem_guarantee: "4G"
            japps-config:
              hub_host: "hub"
              service_workers: 4
              jhub_app_proxy_version: "v0.2.3-rc2"
              additional_services:
                - name: "Nebi"
                  url: "https://nebi.nebari.local"
                  description: "Workspace & environment management"
                  pinned: true
                  thumbnail: "https://raw.githubusercontent.com/nebari-dev/nebi/6b6cef63c67dafd7444f1a3940a0ef8f1dcebb31/assets/nebi-icon.png"
          singleuser:
            image:
              name: quay.io/nebari/nebari-data-science-pack-jupyterlab
              tag: sha-1401182
            networkPolicy:
              egress:
                - to:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: envoy-gateway-system
                      podSelector:
                        matchLabels:
                          gateway.envoyproxy.io/owning-gateway-name: nebari-gateway
                  ports:
                    - port: 10443
                      protocol: TCP
          hub:
            # japps runs inside the hub pod and calls the hub API via the
            # `hub` Service; the hub NetworkPolicy only admits pods with the
            # network-access-hub label, which the hub pod lacks by default.
            # (kind's CNI enforces NetworkPolicies, unlike some cloud CNIs.)
            labels:
              hub.jupyter.org/network-access-hub: "true"
            # Locally every service IP is private; the z2jh default egress
            # policy blocks private IPs, which breaks the japps oauth
            # callback (hub → gateway) with upstream timeouts.
            networkPolicy:
              egressAllowRules:
                privateIPs: true
            extraEnv:
              JUPYTERHUB_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: data-science-pack-nebari-data-science-pack-oidc-client
                    key: client-secret
            db:
              pvc:
                storageClassName: standard
            extraConfig:
              # Iris & Teal palette for the JupyterHub pages and the jhub-apps
              # launcher, matching the landing / chat / llm-serving /
              # provenance packs.
              #
              # Why extraConfig and not custom.japps-config: the pack hardcodes
              # `c.JupyterHub.template_vars = themes.DEFAULT_THEME` in
              # config/jupyterhub/02-jhub-apps.py, and the japps-config loop
              # only sets attributes on c.JAppsConfig — it cannot reach
              # template_vars. z2jh 4.3.2 execs hub.extraConfig *after* it
              # loads jupyterhub_config.d/*.py (see files/hub/jupyterhub_config.py),
              # so re-assigning here wins. The japps service re-reads the same
              # config file at runtime, so it picks these up too.
              #
              # jhub-apps maps these snake_case theme vars onto CSS custom
              # properties (THEME_CSS_VARIABLES in jhub_apps/service/utils.py):
              # primary_color -> --primary-color, and so on. primary_color_light
              # is an 8-digit hex with alpha, matching the #BA18DA10 default.
              #
              # Light mode only: dark-mode hub theming needs jhub-apps >= 2026.7.1
              # and this hub image pins 2025.11.1.
              #
              # NO BANNERS HERE: c.JAppsConfig.banners requires jhub-apps
              # >= 2026.8.1 (added 2026-08-10). This image ships 2025.11.1, and
              # even data-science-pack main only pins 2026.7.1, so setting it
              # would be a silent no-op. Add the CUI banners once the hub image
              # carries 2026.8.1+.
              01-nebari-branding: |
                from jhub_apps import themes
                c.JupyterHub.template_vars = {
                    **themes.DEFAULT_THEME,
                    "primary_color": "#6D4AFF",
                    "primary_color_light": "#6D4AFF14",
                    "primary_color_dark": "#5733E0",
                    "secondary_color": "#0F766E",
                    "secondary_color_dark": "#0B5C56",
                    "accent_color": "#5733E0",
                    "accent_color_dark": "#4526B8",
                }

  destination:
    server: https://kubernetes.default.svc
    namespace: jupyterhub

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        nebari.dev/managed: "true"
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
