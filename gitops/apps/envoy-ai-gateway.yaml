# Envoy AI Gateway: two upstream charts (CRDs, then controller + webhooks).
# Manual install is the documented workaround until the llm-serving chart's
# envoyAIGateway.install flag exists (llm-serving-pack#44).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-ai-gateway-crds
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-packs
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nebari-apps
  source:
    chart: ai-gateway-crds-helm
    repoURL: docker.io/envoyproxy
    targetRevision: v0.5.0
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-ai-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-ai-gateway
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-packs
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nebari-apps
  source:
    chart: ai-gateway-helm
    repoURL: docker.io/envoyproxy
    targetRevision: v0.5.0
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-ai-gateway-system
  # The chart mints the pod-mutator webhook certs with helm genCA, which
  # produces a NEW CA on every render. Under ArgoCD, two syncs can therefore
  # leave the webhook caBundle and the cert secret from different renders
  # (apiserver -> webhook TLS fails, envoy proxy pods can't be created).
  # Freeze both after first sync so re-renders never rotate them.
  ignoreDifferences:
    - kind: Secret
      name: self-signed-cert-for-mutating-webhook
      namespace: envoy-ai-gateway-system
      jsonPointers:
        - /data
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: envoy-ai-gateway-gateway-pod-mutator.envoy-ai-gateway-system
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
