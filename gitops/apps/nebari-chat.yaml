apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nebari-chat
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-packs
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nebari-dev/chat-pack.git
    targetRevision: main
    path: helm/nebari-chat
    helm:
      releaseName: nebari-chat
      values: |
        # Backend token verification via the in-cluster Keycloak service
        keycloak:
          url: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:8080
          realm: nebari

        # Chart defaults are "set-by-cd" placeholders; pin real tags.
        ravnar:
          image:
            tag: "latest"

        frontend:
          image:
            tag: "0.0.99"
          keycloak:
            # Browser-facing auth server URL
            authServerUrl: "https://keycloak.nebari.local"
            realm: nebari
          nebariapp:
            hostname: chat.nebari.local

  destination:
    server: https://kubernetes.default.svc
    namespace: nebari-chat

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        nebari.dev/managed: "true"
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
