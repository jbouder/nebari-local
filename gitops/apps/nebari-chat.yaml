apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nebari-chat
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-packs
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nebari-apps
  source:
    # Released chart (the in-repo chart carries an unstamped "set-by-cd"
    # version that helm rejects — CD stamps it from the chart/vX.Y.Z tag).
    # Requires the quay-oci ArgoCD repository secret.
    #
    # 0.0.26 is the first stable chart that works with app 0.0.15: it renders
    # a config.json ConfigMap (keycloak + branding) and mounts it at
    # /usr/share/nginx/html/config.json. 0.0.25 mounted the older
    # keycloak-config.json path, so the image's baked-in dev config won and
    # the SPA pointed at the upstream dev Keycloak.
    #
    # This release retired three workarounds that the 0.0.26-pr.189
    # pre-release needed — do not reintroduce them:
    #   - ravnar.image.tag / frontend.image.tag pins: appVersion is 0.0.15 and
    #     the parent chart already sets ravnar.image.tag: 0.0.15.
    #   - frontend.securityContext uid 1000 override: the pr chart defaulted
    #     to 65532, which crashlooped the uid-1000 stable image. 0.0.26
    #     defaults to 1000.
    repoURL: oci://quay.io/nebari/charts/nebari-chat
    chart: nebari-chat
    targetRevision: 0.0.26
    helm:
      releaseName: nebari-chat
      values: |
        # Single URL serves the browser SPA redirect AND backend token
        # validation (issuer match), so it must be the external URL. The
        # CoreDNS rewrite makes it resolvable in-cluster; the CA bundle
        # below makes its self-signed cert trusted by the backend.
        keycloak:
          url: https://keycloak.nebari.local
          realm: nebari

        # ravnar subchart: trust the gateway's self-signed cert (httpx
        # honors SSL_CERT_FILE). ConfigMap created out-of-band — see README.
        ravnar:
          # No image pin — the 0.0.26 chart already sets
          # ravnar.image.tag: 0.0.15 (quay.io/nebari/nebari-chat-backend).
          #
          # Stable DB password from an out-of-band secret (see README). The
          # chart's lookup()-based reuse of its generated secret doesn't work
          # under ArgoCD (helm template has no cluster access), so the
          # password would otherwise regenerate on every sync.
          postgres:
            password:
              valueFrom:
                secretKeyRef:
                  name: nebari-chat-postgres-password
                  key: password
          extraEnv:
            SSL_CERT_FILE:
              value: /etc/ssl/nebari/ca-bundle.crt
            # Per-model sk- keys for the LLM gateway (external endpoint).
            # Keys are model-scoped, hence one per model. Secret is created
            # out-of-band by scripts/post-recreate.sh (see README).
            LLM_QWEN35_4B_API_KEY:
              valueFrom:
                secretKeyRef:
                  name: nebari-chat-llm-api-keys
                  key: qwen3-5-4b
            LLM_QWEN36_35B_API_KEY:
              valueFrom:
                secretKeyRef:
                  name: nebari-chat-llm-api-keys
                  key: qwen3-6-35b-a3b
          extraVolumes:
            - name: nebari-ca
              configMap:
                name: nebari-local-ca-bundle
          extraVolumeMounts:
            - name: nebari-ca
              mountPath: /etc/ssl/nebari
              readOnly: true

        # Static agents backed by the cluster's own LLM-serving models,
        # reached through the external AI-gateway endpoint (the internal one
        # wants a short-lived JWT, unusable from static config). The CoreDNS
        # rewrite resolves llm.nebari.local in-cluster and SSL_CERT_FILE
        # (above) trusts its cert. templateLiteral emits Ravnar's {{ VAR }}
        # env-var placeholder, surviving the chart's tpl pass.
        config:
          inline:
            agents:
              static:
                qwen35-4b:
                  cls_or_fn: ravnar.agents.PydanticAiAgentWrapper
                  params:
                    agent:
                      cls_or_fn: pydantic_ai.Agent
                      params:
                        model:
                          cls_or_fn: pydantic_ai.models.openai.OpenAIChatModel
                          params:
                            model_name: unsloth/Qwen3.5-4B-GGUF
                            provider:
                              cls_or_fn: pydantic_ai.providers.openai.OpenAIProvider
                              params:
                                base_url: https://llm.nebari.local/v1
                                api_key: '{{ include "ravnar.env.templateLiteral" "LLM_QWEN35_4B_API_KEY" }}'
                    capabilities:
                      identity:
                        name: "Qwen3.5 4B (cluster)"
                        provider: "Nebari LLM Serving"
                        description: "Qwen3.5-4B served on this cluster via the Nebari LLM serving gateway."
                qwen36-35b:
                  cls_or_fn: ravnar.agents.PydanticAiAgentWrapper
                  params:
                    agent:
                      cls_or_fn: pydantic_ai.Agent
                      params:
                        model:
                          cls_or_fn: pydantic_ai.models.openai.OpenAIChatModel
                          params:
                            model_name: ggml-org/Qwen3.6-35B-A3B-GGUF
                            provider:
                              cls_or_fn: pydantic_ai.providers.openai.OpenAIProvider
                              params:
                                base_url: https://llm.nebari.local/v1
                                api_key: '{{ include "ravnar.env.templateLiteral" "LLM_QWEN36_35B_API_KEY" }}'
                    capabilities:
                      identity:
                        name: "Qwen3.6 35B A3B (cluster)"
                        provider: "Nebari LLM Serving"
                        description: "Qwen3.6-35B-A3B (MoE) served on this cluster via the Nebari LLM serving gateway."

        backend:
          nebariapp:
            hostname: chat-api.nebari.local

        frontend:
          # No image pin and no securityContext override — the chart's
          # appVersion (0.0.15) and its uid-1000 defaults are already correct.
          keycloak:
            # Browser-facing auth server URL
            authServerUrl: "https://keycloak.nebari.local"
            realm: nebari
          # Deep Blue & Teal palette, shared with the landing / llm-serving /
          # provenance packs and the jhub-apps hub theme.
          #
          # This chart uses its own brand-token vocabulary (not the shadcn
          # primary/secondary set): camelCase keys are kebab-cased into CSS
          # custom properties, so bgBrandDefault -> --bg-brand-default. See
          # frontend/src/main.css for the full token list.
          #
          # !! A BRANDING-ONLY EDIT NEEDS A MANUAL RESTART. 0.0.26 delivers
          # these through a ConfigMap mounted with subPath (kubelet never
          # updates a subPath mount in place) and the Deployment carries no
          # checksum/config annotation, so ArgoCD reports Synced/Healthy while
          # nginx keeps serving the old colors. Same trap as the landing page:
          #   kubectl rollout restart deploy/nebari-chat-frontend -n nebari-chat
          # The 0.0.26-pr.189 chart passed these as env vars, which rolled the
          # pod automatically — that convenience is gone. Worth an upstream
          # checksum/config annotation.
          branding:
            theme:
              light:
                bgBrandDefault: "#1D4ED8"
                bdBrandDefault: "#1E3A8A"
                bgBrandSecondary: "#E8EEFC"
                textBrandOnBrand: "#FFFFFF"
              dark:
                bgBrandDefault: "#1D4ED8"
                bdBrandDefault: "#60A5FA"
                bgBrandSecondary: "#132039"
                textBrandOnBrand: "#FBFBFB"
          nebariapp:
            hostname: chat.nebari.local

  destination:
    server: https://kubernetes.default.svc
    namespace: nebari-chat

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        nebari.dev/managed: "true"
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
