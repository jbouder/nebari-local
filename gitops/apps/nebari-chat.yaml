apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nebari-chat
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-packs
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Released chart (the in-repo chart has an unstamped "set-by-cd" version
    # that helm rejects). Requires the quay-oci ArgoCD repository secret.
    repoURL: oci://quay.io/nebari/charts/nebari-chat
    chart: nebari-chat
    targetRevision: 0.0.25
    helm:
      releaseName: nebari-chat
      values: |
        # Backend token verification via the in-cluster Keycloak service
        keycloak:
          url: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:8080
          realm: nebari

        backend:
          nebariapp:
            hostname: chat-api.nebari.local

        frontend:
          keycloak:
            # Browser-facing auth server URL
            authServerUrl: "https://keycloak.nebari.local"
            realm: nebari
          nebariapp:
            hostname: chat.nebari.local

  destination:
    server: https://kubernetes.default.svc
    namespace: nebari-chat

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        nebari.dev/managed: "true"
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
