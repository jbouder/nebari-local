apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nebari-chat
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-packs
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Released chart (the in-repo chart has an unstamped "set-by-cd" version
    # that helm rejects). Requires the quay-oci ArgoCD repository secret.
    repoURL: oci://quay.io/nebari/charts/nebari-chat
    chart: nebari-chat
    targetRevision: 0.0.25
    helm:
      releaseName: nebari-chat
      values: |
        # Single URL serves the browser SPA redirect AND backend token
        # validation (issuer match), so it must be the external URL. The
        # CoreDNS rewrite makes it resolvable in-cluster; the CA bundle
        # below makes its self-signed cert trusted by the backend.
        keycloak:
          url: https://keycloak.nebari.local
          realm: nebari

        # ravnar subchart: trust the gateway's self-signed cert (httpx
        # honors SSL_CERT_FILE). ConfigMap created out-of-band — see README.
        ravnar:
          extraEnv:
            SSL_CERT_FILE: /etc/ssl/nebari/ca-bundle.crt
          extraVolumes:
            - name: nebari-ca
              configMap:
                name: nebari-local-ca-bundle
          extraVolumeMounts:
            - name: nebari-ca
              mountPath: /etc/ssl/nebari
              readOnly: true

        backend:
          nebariapp:
            hostname: chat-api.nebari.local

        frontend:
          keycloak:
            # Browser-facing auth server URL
            authServerUrl: "https://keycloak.nebari.local"
            realm: nebari
          nebariapp:
            hostname: chat.nebari.local

  destination:
    server: https://kubernetes.default.svc
    namespace: nebari-chat

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        nebari.dev/managed: "true"
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
