apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lgtm-pack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-packs
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nebari-apps

  source:
    chart: nebari-lgtm-pack
    repoURL: https://raw.githubusercontent.com/nebari-dev/helm-repository/gh-pages/
    targetRevision: 0.2.0
    helm:
      releaseName: lgtm-pack
      values: |
        nebariapp:
          hostname: grafana.nebari.local
          keycloakHostname: keycloak.nebari.local
          landingPage:
            enabled: true

        grafana:
          # The gateway cert for keycloak.nebari.local is self-signed; tell
          # Grafana's OAuth client not to verify it (local cluster only —
          # same spirit as harbor-pack's oidcSetup.verifyCert: false).
          env:
            GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE: "true"

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        nebari.dev/managed: "true"
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
