apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nebari-landingpage
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-foundational
    app.kubernetes.io/managed-by: nebari-infrastructure-core
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: foundational

  source:
    # TEMPORARY (analytics proof, 2026-10-13): the chart is vendored at
    # gitops/charts/nebari-landing from the UNPUSHED nebari-landing branch
    # feat/analytics-tracker (worktree ~/repos/nebari-landing-analytics,
    # main + frontend.analytics support), and the frontend/webapi images are
    # built from that worktree and `kind load`ed as *:analytics-local.
    # Revert to the upstream repo + a release tag once the branch is merged
    # and released (see "Deliberate version skew" in the README). Previous
    # pin: https://github.com/nebari-dev/nebari-landing @ v0.1.5,
    # path charts/nebari-landing.
    repoURL: file:///Users/johnnybouder/repos/nebari-local
    targetRevision: main
    path: gitops/charts/nebari-landing
    helm:
      releaseName: nebari-landing
      values: |
        frontend:
          image:
            repository: nebari-landing-frontend
            tag: analytics-local
            pullPolicy: Never   # kind-loaded local build (see source comment)
          # Usage analytics via the analytics pack (gitops/apps/nebari-analytics.yaml).
          # websiteId = nebari-landing.id in configmap analytics/analytics-nebari-analytics-websites.
          analytics:
            scriptUrl: https://analytics.nebari.local/script.js
            websiteId: 0f874c31-73fd-5d60-834b-70701f531325
          keycloak:
            # External public Keycloak URL - used by the browser for OIDC login.
            url: "https://keycloak.nebari.local"
            realm: "nebari"
          oauth2Proxy:
            oidcIssuerUrl: "https://keycloak.nebari.local/realms/nebari"

          # Deep Blue & Teal palette, shared with the chat / llm-serving /
          # provenance packs and the jhub-apps hub theme. Rendered into
          # /config.json at deploy time — no image rebuild.
          #
          # NOTE on `secondary`: in this shadcn token set `secondary` is a
          # neutral *surface* (chart default is near-white) paired with dark
          # text, not a brand fill. Full-strength teal there would leave
          # every bg-secondary control at ~2.5:1. So secondary carries a
          # teal *tint* and the saturated teal lives on secondaryForeground.
          #
          # The primaryHover / sidebarRing overrides are gone as of v0.1.5:
          # nebari-landing#200 made index.css derive --primary-hover from
          # --primary (15% oklab darkening in light, 18% lightening in dark)
          # and --sidebar-ring from --ring, so setting the palette tokens is
          # now enough. sidebarRing was an exact no-op (it equalled ring);
          # primaryHover moves off the literal blue-900/blue-300 onto the
          # derived #153DAE / #7EB6FC. Both are now in the chart's documented
          # token list and still accepted as an escape hatch, if a future
          # frontend reintroduces a hardcoded shade.
          branding:
            theme:
              light:
                primary: "#1D4ED8"
                primaryForeground: "#FFFFFF"
                secondary: "#E6FAF7"
                secondaryForeground: "#0F766E"
                accent: "#E8EEFC"
                accentForeground: "#1E3A8A"
                ring: "#1D4ED8"
              dark:
                primary: "#60A5FA"
                primaryForeground: "#0B1220"
                secondary: "#16332F"
                secondaryForeground: "#7FE9DA"
                accent: "#132039"
                accentForeground: "#BFD4FE"
                ring: "#60A5FA"

        webapi:
          image:
            repository: nebari-landing-webapi
            tag: analytics-local
            pullPolicy: Never   # kind-loaded local build (see source comment)
          keycloak:
            # In-cluster URL for JWK fetching (fast, no TLS hop).
            url: "http://keycloak-keycloakx-http.keycloak.svc.cluster.local:8080"
            realm: "nebari"
            # External public URL for validating the iss claim in tokens.
            issuerUrl: "https://keycloak.nebari.local"
            adminSecretName: "keycloak-admin-credentials"
            adminSecretNamespace: "keycloak"

        # Use NebariApp CRs so the nebari-operator manages HTTPRoutes.
        nebariApp:
          enabled: true

        httpRoute:
          hostname: "nebari.local"
          tls: true

        # Pin Redis auth to the existing secret so ArgoCD's selfHeal sync does
        # not regenerate the password. Without this, the Bitnami subchart's
        # helm lookup() returns nil during ArgoCD template rendering (helm
        # template has no cluster access), generating a new random password on
        # every sync. Redis reloads the new password immediately from its
        # mounted secret file, but the webapi pod keeps the old password from
        # its startup env var - causing WRONGPASS ~every 30 min.
        redis:
          auth:
            existingSecret: "nebari-landing-redis"

  destination:
    server: https://kubernetes.default.svc
    namespace: nebari-system

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        nebari.dev/managed: "true"
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # The NebariApp CRD is installed by the nebari-operator (wave 5).
      # ArgoCD dry-runs all resources before syncing, so it reports NebariApp
      # as missing even though wave ordering guarantees the CRD will exist by
      # the time this app (wave 6) actually applies. Skip the dry-run for any
      # resource whose CRD isn't registered yet so the sync doesn't fail on the
      # preflight check.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
