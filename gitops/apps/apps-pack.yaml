apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-pack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-packs
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nebari-apps

  source:
    repoURL: https://github.com/nebari-dev/apps-pack.git
    targetRevision: main
    path: charts/nebari-apps
    helm:
      releaseName: nebari-apps
      values: |
        clusterDomain: nebari.local
        gateway: public
        tls:
          enabled: true

        # The chart defaults image tags to appVersion (0.1.0), which is not
        # published on ghcr; pin the sha tag of the commit in use instead.
        # Images are multi-arch (amd64+arm64) — no digest workarounds needed.
        #
        # sha-8fbc0dd is "feat(operator)!: enforce access.groups at the gateway
        # with nebari-operator v0.2.0" (#168: restricted Apps' groups are
        # enforced by the gateway, the authz sidecar is passthrough-only, and
        # groups match by full path; needs nebari-operator >= v0.2.0), after
        # MCP OAuth for MCP clients #167, the mcp.orgCABundle chart value #165 and
        # #164's restarts and resource limits on the detail page, the status polling
        # fix #162, the search hint removal #163, short app URLs #161, the
        # apps list at / #160, the landing-page switch #159, group-only
        # access #158, which drops access.users; the launch form layout fix #157, the Settings UI
        # version fix #156, the Settings page #155, async skeletons
        # and page transitions #154, the idle fix #151, scale-to-zero #143,
        # managers #144, secrets #145, image sources #146 and MCP resources
        # #147), head of main 2026-10-22. All
        # five images are kept on one sha so the chart and its components stay
        # consistent. The chart follows main, so bump these whenever main's
        # operator flags change: an older operator image crash-loops on flags
        # it does not know.
        # Scale idle Apps to zero after 30 minutes without a request; the
        # next visit gets a "starting" page while the App wakes. Apps opt
        # out with runtime.keepAlive: true.
        apps:
          idle:
            timeoutMinutes: 30
          # Container-image Apps may pull only from these GHCR namespaces and
          # Docker Hub's official images (whole path components:
          # ghcr.io/nebari-dev does not admit ghcr.io/nebari-dev-evil, and
          # docker.io/library admits nginx:1.27 but not bitnami/nginx). Public
          # images need no pull secret.
          image:
            allowedRegistries:
              - ghcr.io/jbouder
              - ghcr.io/nebari-dev
              - docker.io/library
        operator:
          image:
            tag: sha-8fbc0dd
        api:
          image:
            tag: sha-8fbc0dd
          # Users may launch apps into this namespace (also the release ns,
          # so ArgoCD creates and labels it).
          allowedNamespaces:
            - apps
        ui:
          image:
            tag: sha-8fbc0dd
          # Deep Blue & Teal palette, shared with the landing / chat /
          # llm-serving / provenance packs and the jhub-apps hub theme.
          #
          # NOTE on `secondary`: as in the other shadcn packs, `secondary` is a
          # neutral *surface* token paired with dark text, not a brand fill, so
          # it carries a teal tint and the saturated teal sits on
          # secondaryForeground.
          #
          # headerBackground / headerForeground / headerBorder / bodyBackground
          # are this pack's own top-bar tokens. Left unset deliberately — they
          # default to neutral zinc, which matches the neutral chrome of the
          # other packs. Set them only to brand the top bar itself.
          #
          # primaryHover / sidebarPrimary / sidebarRing are NOT in this chart's
          # documented token list, but ui/src/index.css hardcodes them to the
          # magenta scale (--primary-hover: var(--primary-magenta-700), etc.)
          # where `primary` alone cannot reach — primaryHover drives button and
          # badge hover. They apply because toCssVars() kebab-cases whatever
          # keys the JSON carries with no runtime allowlist (ThemeTokens is a
          # compile-time type). Same defect the llm-serving, provenance, and
          # landing packs just fixed upstream; drop these once apps-pack derives
          # them from --primary too.
          branding:
            theme:
              light:
                primary: "#1D4ED8"
                primaryForeground: "#FFFFFF"
                secondary: "#E6FAF7"
                secondaryForeground: "#0F766E"
                accent: "#E8EEFC"
                accentForeground: "#1E3A8A"
                ring: "#1D4ED8"
                primaryHover: "#1E3A8A"
                sidebarPrimary: "#1D4ED8"
                sidebarRing: "#1D4ED8"
              dark:
                primary: "#60A5FA"
                primaryForeground: "#0B1220"
                secondary: "#16332F"
                secondaryForeground: "#7FE9DA"
                accent: "#132039"
                accentForeground: "#BFD4FE"
                ring: "#60A5FA"
                primaryHover: "#93C5FD"
                sidebarPrimary: "#60A5FA"
                sidebarRing: "#60A5FA"
        mcp:
          image:
            tag: sha-8fbc0dd
          # apps-mcp fetches JWKS / talks to https://keycloak.nebari.local from
          # the pod; trust the local root CA (ConfigMap from post-recreate.sh).
          orgCABundle:
            configMapName: nebari-local-ca-bundle
          # Public PKCE client Claude Code signs in with (MCP OAuth). Not
          # provisioned by the nebari-operator: created by hand in the realm,
          # see scripts/post-recreate.sh.
          oauth:
            clientId: nebari-apps-mcp
        authz:
          image:
            tag: sha-8fbc0dd

        keycloak:
          # Browser-facing URL (SPA login); the API fetches JWKS via the
          # in-cluster URL (split horizon — natively supported by this chart).
          url: https://keycloak.nebari.local
          realm: nebari
          internalUrl: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:8080

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        nebari.dev/managed: "true"
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
