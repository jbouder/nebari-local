apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-serving-pack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-packs
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nebari-apps

  source:
    repoURL: https://nebari-dev.github.io/helm-repository
    chart: nebari-llm-serving
    # 0.1.4 carries #166, #168 and #169 in the release itself, so the images
    # below track the release commit rather than a mid-branch one.
    #
    # A chart version is only usable once it appears in the published index —
    # this pack's "Release Chart" workflow does not push there, it opens a sync
    # PR against nebari-dev/helm-repository. Pointing targetRevision at a
    # tagged-but-unpublished version makes ArgoCD fail to resolve the chart and
    # stop syncing while STILL reporting Healthy (the live workloads are
    # untouched) — a silent stall whose only tell is `Sync: Unknown` plus a
    # ComparisonError condition. Before bumping, confirm it exists:
    #   curl -s https://nebari-dev.github.io/helm-repository/index.yaml | \
    #     yq '.entries.nebari-llm-serving[].version'
    targetRevision: "0.1.4"
    helm:
      releaseName: nebari-llm-serving
      values: |
        # ArgoCD creates + labels the namespace (managedNamespaceMetadata).
        createNamespace: false

        platform:
          baseDomain: nebari.local
          gateway:
            # This cluster has a single shared gateway; use it for both.
            external:
              name: nebari-gateway
              namespace: envoy-gateway-system
            internal:
              name: nebari-gateway
              namespace: envoy-gateway-system
            manageSharedListeners: true
          tls:
            clusterIssuer: selfsigned-issuer

        auth:
          oidc:
            # Per-model JWT auth; explicit external issuer (matches token iss).
            issuerURL: https://keycloak.nebari.local/realms/nebari
            groupsClaim: groups

        # NOTE: no GPUs on this local cluster — the control plane (operator,
        # key manager, routing) runs fine, but LLMModel CRs will not schedule
        # (llm-d serving images are CUDA-only).

        # ghcr images are amd64-only, so they stay digest-pinned for the arm64
        # kind node EVEN THOUGH the chart is now on the matching release: an
        # unpinned tag fails containerd's platform match here.
        #
        # Only the @sha256 digest is doing work — NOT the tag. The published
        # 0.1.4 chart already defaults these to "sha-a8e74a3" (pack-release
        # rewrites the tag-paths at package time), even though the in-repo
        # values.yaml reads "latest". So this block is the chart's own tag plus
        # a digest, not an override to a different build.
        #
        # sha-a8e74a3 is the 0.1.4 tag commit, so chart and images are one
        # release. It carries:
        #   #166 — the LLMModel reconciler no longer wipes the
        #     <model>-api-key-metadata ConfigMap, so minted keys stay listed in
        #     the llm-keys UI instead of vanishing right after creation.
        #   #168 — the operator stamps timeouts.request on both generated
        #     AIGatewayRoutes, which replaced the manual 600s patch loop
        #     post-recreate.sh used to re-apply after every reconcile.
        #   #169 — the frontend derives --primary-hover / --sidebar-primary /
        #     --sidebar-ring from --primary, so the branding block below no
        #     longer carries those undocumented overrides.
        #
        # 0.1.4 also ships the post-#168 CRD, so spec.endpoints.requestTimeout
        # now EXISTS on the LLMModel CRs and may be set per model. Leaving it
        # unset is still correct here: the operator's DefaultRequestTimeout and
        # the CRD default are both "600s", which is the value we want.
        operator:
          image:
            tag: "sha-a8e74a3@sha256:1776a14bcbf5e70341a11db71b721c43428f60361adcd9f50b422922a3deaf16"
            pullPolicy: IfNotPresent
        keyManager:
          enabled: true
          image:
            tag: "sha-a8e74a3@sha256:3f7c8839e087c319620ade6974a881e2620c205f4c003f3b9234a11f73000fe9"
            pullPolicy: IfNotPresent
          # Split horizon: JWKS fetched in-cluster, issuer validated external.
          keycloak:
            url: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:8080
            realm: nebari
            issuerURL: https://keycloak.nebari.local
          nebariApp:
            enabled: true
            hostname: llm-keys.nebari.local
        frontend:
          enabled: true
          # Same release commit as the operator/key-manager above.
          image:
            tag: "sha-a8e74a3@sha256:21fe47742b23a7c4b9ae3ebae82821c9c8c1699b26052d594c9339b9418fe6fb"
            pullPolicy: IfNotPresent
          keycloak:
            url: https://keycloak.nebari.local
            realm: nebari
          # Deep Blue & Teal palette, shared with the landing / chat / provenance
          # packs and the jhub-apps hub theme. Rendered into /config.json at
          # deploy time — no image rebuild.
          #
          # NOTE on `secondary`: this chart's default is a near-white neutral
          # *surface* token with dark text, not a brand fill, so secondary
          # carries a teal tint and the saturated teal sits on
          # secondaryForeground. Chart default primary is the old Nebari
          # magenta, oklch(55.06% 0.1886 311.45).
          #
          # No primaryHover / sidebarPrimary / sidebarRing overrides: #169 (in
          # this release) derives those from --primary, so the old Nebari
          # magenta no longer leaks into hover and sidebar states. They were
          # undocumented keys that only worked because the runtime applier
          # kebab-cases whatever the JSON carries with no allowlist — if a
          # future frontend bump ever reintroduces a hardcoded hover shade,
          # that escape hatch still exists.
          branding:
            theme:
              light:
                primary: "#1D4ED8"
                primaryForeground: "#FFFFFF"
                secondary: "#E6FAF7"
                secondaryForeground: "#0F766E"
                accent: "#E8EEFC"
                accentForeground: "#1E3A8A"
                ring: "#1D4ED8"
              dark:
                primary: "#60A5FA"
                primaryForeground: "#0B1220"
                secondary: "#16332F"
                secondaryForeground: "#7FE9DA"
                accent: "#132039"
                accentForeground: "#BFD4FE"
                ring: "#60A5FA"

        defaults:
          storage:
            storageClassName: standard

  destination:
    server: https://kubernetes.default.svc
    namespace: nebari-llm-serving-system

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        nebari.dev/managed: "true"
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
