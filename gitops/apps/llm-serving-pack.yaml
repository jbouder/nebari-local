apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-serving-pack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-packs
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nebari-apps

  source:
    repoURL: https://nebari-dev.github.io/helm-repository
    chart: nebari-llm-serving
    # 0.1.4 is tagged upstream but NOT PUBLISHED yet: the pack's "Release
    # Chart" workflow doesn't push to the index, it opens a sync PR against
    # nebari-dev/helm-repository, and #82 is still open. Setting 0.1.4 here
    # makes ArgoCD fail to resolve the chart and stop syncing entirely
    # ("ComparisonError: chart ... not found"), while still reporting Healthy
    # because the live workloads are untouched — a silent stall.
    #
    # Upgrade once #82 merges (verify: the version appears under
    # `entries.nebari-llm-serving` in the repo's index.yaml). Then:
    #   - targetRevision: "0.1.4"
    #   - repin all three images to sha-a8e74a3 (the 0.1.4 tag commit):
    #       operator    sha256:1776a14bcbf5e70341a11db71b721c43428f60361adcd9f50b422922a3deaf16
    #       keyManager  sha256:3f7c8839e087c319620ade6974a881e2620c205f4c003f3b9234a11f73000fe9
    #       frontend    sha256:21fe47742b23a7c4b9ae3ebae82821c9c8c1699b26052d594c9339b9418fe6fb
    #     Keep them digest-pinned: 0.1.4 defaults every tag to "latest", and
    #     these images are amd64-only, so an unpinned tag won't platform-match
    #     on the arm64 kind node.
    #   - drop the "must NOT set requestTimeout" caveat below: 0.1.4 ships the
    #     post-#168 CRD, so spec.endpoints.requestTimeout becomes settable.
    # Nothing is lost by waiting — the sha-4cfb58c pins below already carry
    # #166, #168 and #169.
    targetRevision: "0.1.3"
    helm:
      releaseName: nebari-llm-serving
      values: |
        # ArgoCD creates + labels the namespace (managedNamespaceMetadata).
        createNamespace: false

        platform:
          baseDomain: nebari.local
          gateway:
            # This cluster has a single shared gateway; use it for both.
            external:
              name: nebari-gateway
              namespace: envoy-gateway-system
            internal:
              name: nebari-gateway
              namespace: envoy-gateway-system
            manageSharedListeners: true
          tls:
            clusterIssuer: selfsigned-issuer

        auth:
          oidc:
            # Per-model JWT auth; explicit external issuer (matches token iss).
            issuerURL: https://keycloak.nebari.local/realms/nebari
            groupsClaim: groups

        # NOTE: no GPUs on this local cluster — the control plane (operator,
        # key manager, routing) runs fine, but LLMModel CRs will not schedule
        # (llm-d serving images are CUDA-only).

        # ghcr images are amd64-only; digest-pinned for the arm64 kind node.
        #
        # All three run AHEAD of the 0.1.3 chart at main's sha-4cfb58c, which
        # carries two fixes this cluster depends on:
        #   #166 (fb3c123) — the LLMModel reconciler no longer wipes the
        #     <model>-api-key-metadata ConfigMap, so minted keys stay listed in
        #     the llm-keys UI instead of vanishing right after creation.
        #   #168 (4cfb58c) — the operator stamps timeouts.request on both
        #     generated AIGatewayRoutes, replacing the manual 600s patch loop
        #     that post-recreate.sh used to re-apply after every reconcile.
        # #168 also adds spec.endpoints.requestTimeout to the LLMModel CRD, but
        # chart 0.1.3 ships the pre-#168 CRD, so that field does not exist
        # in-cluster and must NOT be set on the LLMModel CRs. Not needed: the
        # operator falls back to its own DefaultRequestTimeout ("600s") when the
        # field is empty, which is exactly the value we want. (Chart 0.1.4 does
        # ship the new CRD — see the targetRevision note above.)
        operator:
          image:
            tag: "sha-4cfb58c@sha256:7fd48441427e9ba6fa8c28c6429b45d7d7d81465dfac765b3376b6bb5c4e3458"
            pullPolicy: IfNotPresent
        keyManager:
          enabled: true
          image:
            tag: "sha-4cfb58c@sha256:f088dfc869e8b27c4f540926f943fff0d932226ecacf33ff3e9d695edd2ab95d"
            pullPolicy: IfNotPresent
          # Split horizon: JWKS fetched in-cluster, issuer validated external.
          keycloak:
            url: http://keycloak-keycloakx-http.keycloak.svc.cluster.local:8080
            realm: nebari
            issuerURL: https://keycloak.nebari.local
          nebariApp:
            enabled: true
            hostname: llm-keys.nebari.local
        frontend:
          enabled: true
          # Same main build as the operator/key-manager above, so all three
          # stay on one commit. Includes PR #169 (c054c56), which derives
          # --primary-hover / --sidebar-primary / --sidebar-ring from --primary
          # instead of hardcoding the old Nebari magenta. With this image the
          # branding block below no longer needs the undocumented
          # primaryHover/sidebarPrimary/sidebarRing overrides — they are kept
          # only until a chart release carries the fix and this pin is dropped.
          image:
            tag: "sha-4cfb58c@sha256:4dee53172fe1eaa9da62b7795121efe338a6cfbd91a964d96a322b3040d0fc6a"
            pullPolicy: IfNotPresent
          keycloak:
            url: https://keycloak.nebari.local
            realm: nebari
          # Deep Blue & Teal palette, shared with the landing / chat / provenance
          # packs and the jhub-apps hub theme. Rendered into /config.json at
          # deploy time — no image rebuild.
          #
          # NOTE on `secondary`: this chart's default is a near-white neutral
          # *surface* token with dark text, not a brand fill, so secondary
          # carries a teal tint and the saturated teal sits on
          # secondaryForeground. Chart default primary is the old Nebari
          # magenta, oklch(55.06% 0.1886 311.45).
          #
          # primaryHover / sidebarPrimary / sidebarRing are NOT in the chart's
          # documented token list, but they are real purple (oklch hue ~311)
          # defaults in the frontend's index.css that `primary` alone does not
          # reach — primaryHover drives every button and badge hover state.
          # They work because the runtime applier kebab-cases whatever keys the
          # JSON carries with no allowlist (ThemeTokens is a compile-time type
          # only), and the chart passes the theme map straight through toJson.
          # Undocumented, so re-check after a frontend bump.
          branding:
            theme:
              light:
                primary: "#1D4ED8"
                primaryForeground: "#FFFFFF"
                secondary: "#E6FAF7"
                secondaryForeground: "#0F766E"
                accent: "#E8EEFC"
                accentForeground: "#1E3A8A"
                ring: "#1D4ED8"
                primaryHover: "#1E3A8A"
                sidebarPrimary: "#1D4ED8"
                sidebarRing: "#1D4ED8"
              dark:
                primary: "#60A5FA"
                primaryForeground: "#0B1220"
                secondary: "#16332F"
                secondaryForeground: "#7FE9DA"
                accent: "#132039"
                accentForeground: "#BFD4FE"
                ring: "#60A5FA"
                primaryHover: "#93C5FD"
                sidebarPrimary: "#60A5FA"
                sidebarRing: "#60A5FA"

        defaults:
          storage:
            storageClassName: standard

  destination:
    server: https://kubernetes.default.svc
    namespace: nebari-llm-serving-system

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        nebari.dev/managed: "true"
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
