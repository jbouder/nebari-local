apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frames-pack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-packs
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nebari-apps

  # Vendored copy of the upstream nebari-frames chart, tracking main at
  # 84cdd83 rather than the v0.1.5 release — that release predates branding
  # and there is no newer tag yet. One local
  # addition on top: orgCABundle support, because the backend fails fast
  # fetching OIDC discovery from https://keycloak.nebari.local and the
  # upstream chart has no way to inject the gateway CA. Drop the vendored
  # copy once upstream grows extraEnv/extraVolumes or a CA option; re-vendor
  # from a tag once one carries branding.
  source:
    repoURL: file:///Users/johnnybouder/repos/nebari-local
    targetRevision: main
    path: gitops/charts/nebari-frames
    helm:
      releaseName: frames
      values: |
        image:
          # amd64-only image pinned by digest for the arm64 kind node (Rosetta).
          # Must be a main build, not v0.1.5: the Go server is what serves
          # /config.json, so branding needs the backend from the same commit
          # as the vendored chart.
          #
          # 84cdd83 ("Header cleanup") is frontend-only — it rebuilds the
          # header nav in web/src/components/layout/Header.tsx and touches no
          # chart file, so the vendored chart from b8db7f5 is still current.
          # The SPA is embedded in the Go binary, so header changes ship in
          # this image and nowhere else.
          tag: "sha-84cdd83@sha256:f9fe87bd92df3522c0bcf517f488c798cb7ea5ff0acd3703fda1437b5fab3bc6"

        # Deep Blue & Teal palette, shared with the landing / chat / provenance /
        # llm-serving / apps packs. Rendered into a ConfigMap and served by the
        # backend at /config.json — no image rebuild. The chart stamps a
        # checksum/config annotation, so the pod rolls itself on a
        # branding-only edit (unlike the landing page).
        #
        # No primaryHover / ring overrides here: unlike the other shadcn packs,
        # this frontend DERIVES --primary-hover (a 15% oklab darkening in light,
        # 18% lightening in dark) and --ring from an overridden --primary, so
        # setting primary alone keeps hover and focus states on-brand.
        # title / logoUrl / faviconUrl are left unset — the built-in Nebari
        # wordmark and favicon are what we want here.
        branding:
          theme:
            light:
              primary: "#1D4ED8"
              primaryForeground: "#FFFFFF"
              secondary: "#E6FAF7"
              secondaryForeground: "#0F766E"
              accent: "#E8EEFC"
              accentForeground: "#1E3A8A"
            dark:
              primary: "#60A5FA"
              primaryForeground: "#0B1220"
              secondary: "#16332F"
              secondaryForeground: "#7FE9DA"
              accent: "#132039"
              accentForeground: "#BFD4FE"

        nebariapp:
          enabled: true
          hostname: frames.nebari.local
          # Hidden from the landing page, not removed: the NebariApp, its
          # route, and its Keycloak client all stay in place, so
          # https://frames.nebari.local keeps working for anyone with the
          # URL — the operator just stops advertising a tile for it.
          # Flip back to true to show it again.
          landingPage:
            enabled: true

        seed:
          orgSlug: nebari-local
          orgDisplayName: "Nebari Local"
          adminEmail: admin@nebari.local  # must match the realm admin user email (email-matched invite)

        orgCABundle:
          configMapName: nebari-local-ca-bundle

  destination:
    server: https://kubernetes.default.svc
    namespace: frames

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        nebari.dev/managed: "true"
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
