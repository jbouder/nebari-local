apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frames-pack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nebari-packs
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nebari-apps

  # Vendored copy of the PUBLISHED nebari-frames 0.1.7 chart — no longer
  # tracking main. 0.1.7 is the release of 3dd1659; it adds the revamped frame
  # authoring flow (#58) on top of 0.1.6's branding and header rebuild.
  #
  # Still vendored for one reason only: orgCABundle support. The backend fails
  # fast fetching OIDC discovery from https://keycloak.nebari.local and the
  # upstream chart still has no way to inject the gateway CA (re-checked
  # against 0.1.7 — no extraEnv, extraVolumes or caBundle hook; the 0.1.6 ->
  # 0.1.7 chart diff is the version bump and nothing else). Drop the
  # vendored copy the moment upstream grows one; re-vendor with
  #   helm pull nebari/nebari-frames --version <v> --untar
  # and re-apply the orgCABundle delta (values.yaml + templates/deployment.yaml).
  # Pull the PUBLISHED chart, not git: CI stamps version/appVersion at release
  # time, so the in-repo Chart.yaml always reads 0.1.0.
  source:
    repoURL: file:///Users/johnnybouder/repos/nebari-local
    targetRevision: main
    path: gitops/charts/nebari-frames
    helm:
      releaseName: frames
      values: |
        image:
          # amd64-only image pinned by digest for the arm64 kind node (Rosetta).
          # Release tag rather than a sha- build, matching the chart's
          # appVersion.
          #
          # Keep chart and image on the same release: the SPA is embedded in the
          # Go binary, so every web change (header, nav, branding applier, the
          # 0.1.7 authoring revamp) ships in this image and nowhere else. A UI
          # change that doesn't appear is almost always a stale image pin.
          tag: "v0.1.7@sha256:094e71d29f8569b12a2823e47f0aa6793c65e5579f43fc8eb0e6b0ea4b49cc2a"

        # Deep Blue & Teal palette, shared with the landing / chat / provenance /
        # llm-serving / apps packs. Rendered into a ConfigMap and served by the
        # backend at /config.json — no image rebuild. The chart stamps a
        # checksum/config annotation, so the pod rolls itself on a
        # branding-only edit (unlike the landing page).
        #
        # No primaryHover / ring overrides here: unlike the other shadcn packs,
        # this frontend DERIVES --primary-hover (a 15% oklab darkening in light,
        # 18% lightening in dark) and --ring from an overridden --primary, so
        # setting primary alone keeps hover and focus states on-brand.
        # title / logoUrl / faviconUrl are left unset — the built-in Nebari
        # wordmark and favicon are what we want here.
        branding:
          theme:
            light:
              primary: "#1D4ED8"
              primaryForeground: "#FFFFFF"
              secondary: "#E6FAF7"
              secondaryForeground: "#0F766E"
              accent: "#E8EEFC"
              accentForeground: "#1E3A8A"
            dark:
              primary: "#60A5FA"
              primaryForeground: "#0B1220"
              secondary: "#16332F"
              secondaryForeground: "#7FE9DA"
              accent: "#132039"
              accentForeground: "#BFD4FE"

        nebariapp:
          enabled: true
          hostname: frames.nebari.local
          # Hidden from the landing page, not removed: the NebariApp, its
          # route, and its Keycloak client all stay in place, so
          # https://frames.nebari.local keeps working for anyone with the
          # URL — the operator just stops advertising a tile for it.
          # Flip back to true to show it again.
          landingPage:
            enabled: true

        seed:
          orgSlug: nebari-local
          orgDisplayName: "Nebari Local"
          adminEmail: admin@nebari.local  # must match the realm admin user email (email-matched invite)

        orgCABundle:
          configMapName: nebari-local-ca-bundle

  destination:
    server: https://kubernetes.default.svc
    namespace: frames

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        nebari.dev/managed: "true"
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
