project_name: nebari-local
domain: nebari.local

certificate:
  type: selfsigned

cluster:
  local:
    kind:
      extra_mounts:
        # GitOps repo mount — must exactly match git_repository.url path below
        - host_path: /Users/johnnybouder/repos/nebari-local
          container_path: /Users/johnnybouder/repos/nebari-local
          read_only: true
    node_selectors:
      general:
        kubernetes.io/os: linux
      user:
        kubernetes.io/os: linux
      worker:
        kubernetes.io/os: linux

# This repo doubles as the GitOps repo; ArgoCD reads the committed content
# through the kind mount above. The tree lives under gitops/, which NIC
# < 0.15 wrote via git_repository.path. NIC >= 0.15's local provider has no
# subdirectory option and would write at the repo root, so don't run
# `nic deploy` against this cluster: foundational upgrades are ported to
# gitops/ by hand (see docs/nic-0.15-upgrade-plan.md).
repository:
  local:
    path: /Users/johnnybouder/repos/nebari-local
    branch: main
